site_name: keras-sciml
site_description: Scientific Machine Learning in Keras 3
site_author: Muhammad Anas Raza
repo_name: anas-rz/keras-sciml
repo_url: https://github.com/anas-rz/keras-sciml

theme:
  name: material
  icon:
    logo: material/atom
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Scheme toggle for light mode
    - scheme: default
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Scheme toggle for dark mode
    - scheme: slate
      primary: deep purple
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.tabs.link

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: true
            show_source: true
            heading_level: 2
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - attr_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Neural Operators: guides/neural-operators.md
      - Differential Operators: guides/differential-operators.md
      - Physics-Informed Learning: guides/physics-informed.md
      - Scientific Datasets: guides/datasets.md
  - Examples:
      - Overview: examples/index.md
      - 2D Darcy Flow (FNO2D): examples/darcy-flow.md
      - 1D Burgers' Equation (FNO1D & PINO): examples/burgers.md
      - Antiderivative Operator (DeepONet): examples/antiderivative.md
      - 1D Poisson Equation (PINN): examples/poisson-pinn.md
      - Sea Surface Temperature (FNO2D): examples/sea-surface-temperature.md
  - API Reference:
      - Operators: api/operators.md
      - Differential Layers: api/differential.md
      - Physics & Constraints: api/physics.md
      - Models: api/models.md
      - Losses & Metrics: api/losses.md
      - Datasets: api/datasets.md
  - Developer Guide:
      - Testing Philosophy: developer/testing.md
      - Contributing: developer/contributing.md
