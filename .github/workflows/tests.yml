name: Tests

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tests/**"
      - "keras_sciml/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "tests/**"
      - "keras_sciml/**"
      - "examples/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.backend }}, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        backend: ["torch", "tensorflow", "jax"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade Pip and Build Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install PyTorch (required across all backends for reference parity tests)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install TensorFlow Backend
        if: matrix.backend == 'tensorflow'
        run: |
          pip install tensorflow-cpu

      - name: Install JAX Backend
        if: matrix.backend == 'jax'
        run: |
          pip install "jax[cpu]"

      - name: Install keras-sciml
        run: |
          pip install -e ".[test]"

      - name: Run Test Suite (${{ matrix.backend }})
        env:
          KERAS_BACKEND: ${{ matrix.backend }}
        run: |
          pytest tests/ -q

